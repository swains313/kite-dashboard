name: CI/CD Pipeline - Kite Dashboard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './package.json'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  deploy:
    name: Build Docker Image & Deploy to EC2
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: ${{ secrets.DOCKER_USERNAME }}/kite-dashboard:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Pulling latest kite-dashboard image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/kite-dashboard:latest
            docker stop kite-dashboard || true
            docker rm kite-dashboard || true
            docker run -d \
              --name kite-dashboard \
              --restart unless-stopped \
              -p ${{ secrets.CLIENT_PORT || '3000' }}:3000 \
              -e NODE_ENV=production \
              -e PORT=3000 \
              ${{ secrets.DOCKER_USERNAME }}/kite-dashboard:latest
            echo "Deployment finished. Checking health..."
            sleep 3
            curl -f http://localhost:${{ secrets.CLIENT_PORT || '3000' }}/api/health || exit 1
